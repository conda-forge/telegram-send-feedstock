{% set name = "telegram-send" %}
{% set version = "0.39.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: bb1570fda809a030dfa188ffb30fd92b97de6cde9f1268d57fed6b28c2f4aff5

build:
  number: 1
  entry_points:
    - telegram-send = telegram_send.telegram_send:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python
  run:
    - platformdirs >=4.5.1
    - colorama  # [win]
    - python
    - python-telegram-bot ==22.5

test:
  requires:
    - python {{ python_min }}
  commands:
    - telegram-send --help

about:
  home: https://github.com/rahiel/telegram-send
  license: GPL-3.0-only
  license_family: GPL3
  license_file: LICENSE.txt
  summary: Send messages and files over Telegram from the command-line.
  dev_url: https://github.com/rahiel/telegram-send

extra:
  recipe-maintainers:
    - proinsias
